version: 2

updates:
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
      - /packages/*
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Luanda
    open-pull-requests-limit: 3
    groups:
      noogym-npm:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /apps/web-admin
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Africa/Luanda
    open-pull-requests-limit: 1

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:45"
      timezone: Africa/Luanda
    open-pull-requests-limit: 2
    groups:
      github-actions:
        patterns:
          - "*"
