version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Africa/Luanda
    open-pull-requests-limit: 10
    groups:
      noogym-npm:
        patterns:
          - "*"

