services:
  mysql:
    image: 'mysql:8.4'
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: '${MYSQL_DATABASE:-noogymsoftware}'
      MYSQL_USER: '${MYSQL_USER:-noogym}'
      MYSQL_PASSWORD: '${MYSQL_PASSWORD:-noogym_password}'
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:-noogym_root_password}'
    expose:
      - '3306'
    volumes:
      - 'noogym_mysql_data:/var/lib/mysql'
    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent'
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: apps/noogym-erp-api/Dockerfile
    image: noogym-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      NODE_ENV: production
      AUTH_PROVIDER: '${AUTH_PROVIDER:-local}'
      PORT: 3333
      DATABASE_URL: '${DATABASE_URL:-mysql://noogym:noogym_password@mysql:3306/noogymsoftware}'
      DATABASE_RETRY_DELAY_MS: '${DATABASE_RETRY_DELAY_MS:-2000}'
      JWT_SECRET: '${JWT_SECRET:-change-this-secret-before-production-please}'
      JWT_EXPIRES_IN: '${JWT_EXPIRES_IN:-1d}'
      CORS_ORIGINS: '${CORS_ORIGINS:-https://demo.noogym.com}'
      THROTTLE_TTL_MS: '${THROTTLE_TTL_MS:-60000}'
      THROTTLE_LIMIT: '${THROTTLE_LIMIT:-120}'
      RUN_MIGRATIONS: '${RUN_MIGRATIONS:-true}'
    expose:
      - '3333'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "require('http').get('http://127.0.0.1:3333/health',res=>{process.exit(res.statusCode<500?0:1)}).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 40s

  web-admin:
    build:
      context: .
      dockerfile: apps/web-admin/Dockerfile
      args:
        NEXT_PUBLIC_NOOGYM_API_URL: '${NEXT_PUBLIC_NOOGYM_API_URL:-https://apiv1.noogym.com}'
    image: noogym-web-admin
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_NOOGYM_API_URL: '${NEXT_PUBLIC_NOOGYM_API_URL:-https://apiv1.noogym.com}'
    expose:
      - '3000'
    healthcheck:
      test:
        - CMD
        - node
        - '-e'
        - "require('http').get('http://127.0.0.1:3000/',res=>{process.exit(res.statusCode<500?0:1)}).on('error',()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  noogym_mysql_data: null
